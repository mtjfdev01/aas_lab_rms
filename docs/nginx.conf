server {
    listen 80;
    root /srv/rms/frontend/dist;
    index index.html;
    client_max_body_size 6m;
    location /api/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    # Keep platform administration behind a separate restricted origin in production.
    location /platform-api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
