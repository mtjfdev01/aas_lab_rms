services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: rms_owner
      POSTGRES_PASSWORD: local_owner_password
      POSTGRES_DB: rms
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - db:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms_owner -d rms"]
      interval: 3s
      retries: 20
volumes:
  db:
